<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Корзина</title>
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/shop.css" />
    <link rel="stylesheet" href="styles/market.css" />
  </head>
  <body>
    <header class="header">
      <div class="container header__inner">
        <a class="catalog-btn" href="index.html">← Каталог</a>
        <div style="flex:1"></div>
        <span class="live" id="live" data-status="offline" aria-live="polite"><i></i>вживую</span>
        <a class="header__cart" href="cart.html" title="Корзина">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6h15l-1.5 9h-12z"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M6 6 5 3H2"/></svg>
          <span class="header__cart-count" id="cart-count" hidden></span>
        </a>
      </div>
    </header>

    <main class="page container product">
      <h1>Корзина</h1>
      <p class="muted">
        Цена в корзине всегда действующая. Если товар подорожал, рядом с новой
        ценой видно прежнюю.
      </p>
      <section class="offers" id="cart" aria-live="polite"></section>
      <div class="cart__total" id="cart-total"></div>
    </main>

    <div class="toasts" id="toasts"></div>
    <script type="module" src="js/cart.js"></script>
  </body>
</html>
