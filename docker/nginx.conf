server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS докера + upstream через переменную: иначе nginx резолвит адрес api
    # один раз при старте и после пересоздания контейнера отдаёт 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Живая витрина. Точное совпадение "=" побеждает регулярное выражение ниже
    # независимо от порядка в файле, так что общий проксирующий блок не тронут.
    location = /api/stream {
        set $upstream http://api:3000;
        proxy_pass $upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        # Без этого nginx рвёт молчащее соединение через минуту, а между
        # кадрами ping/pong проходит пятнадцать секунд.
        proxy_read_timeout 1h;
    }

    # Признак живости потока нужен с того же origin, что и витрина: иначе
    # «поток лёг» видно только тому, у кого есть доступ к API напрямую.
    location = /health {
        set $upstream http://api:3000;
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
    }

    # Фронт и API на одном origin — не нужен ни CORS, ни настройка API_BASE
    location ~ ^/(api|webhook|admin)/ {
        set $upstream http://api:3000;
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location / {
        # Демо-стенд: правки в web/ подхватываются сразу. Иначе браузер держит
        # старый модуль, страница выглядит рабочей, а ведёт себя как вчера.
        add_header Cache-Control "no-store";
        try_files $uri $uri/ =404;
    }
}
